name: Refresh streak stats cache

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch streak stats SVG
        run: |
          URL="https://streak-stats.demolab.com/?user=Lathesh03&theme=radical&hide_border=true"
          for i in 1 2 3 4 5 6; do
            if curl -sf "$URL" -o streak.svg.tmp && grep -q "<svg" streak.svg.tmp && ! grep -qi "Failed to retrieve" streak.svg.tmp; then
              mv streak.svg.tmp streak.svg
              echo "Streak stats OK on attempt $i"
              break
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git diff --cached --quiet || git commit -m "chore: refresh streak stats svg"
          git push
