name: Refresh streak stats cache

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump cache-buster on streak stats image
        run: |
          STAMP=$(date +%Y%m%d)
          sed -i -E "s#(streak-stats\.demolab\.com/[^\"]*v=)[0-9]+#\1${STAMP}#" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh streak stats cache-buster"
          git push
