name: Refresh streak stats cache

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump cache-buster on streak stats image
        run: |
          STAMP=$(date +%s)
          URL="https://streak-stats.demolab.com/?user=Lathesh03&theme=radical&hide_border=true&v=${STAMP}"
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -s "$URL")
            if echo "$BODY" | grep -q "<svg" && ! echo "$BODY" | grep -qi "Failed to retrieve"; then
              echo "Streak stats OK on attempt $i"
              break
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          sed -i -E "s#(streak-stats\.demolab\.com/[^\"]*v=)[0-9]+#\1${STAMP}#" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh streak stats cache-buster"
          git push
